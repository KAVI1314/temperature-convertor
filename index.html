<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Poppins",sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#3b2a64,#2a1f4c);
}

/* PHONE */
.phone{
  width:340px;
  background:linear-gradient(180deg,#3b2a64,#2a1f4c);
  border-radius:30px;
  padding:20px;
  color:white;
  box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.header span{
  font-size:14px;
  opacity:0.8;
}

/* DISPLAY */
.display{
  padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,0.1);
  margin-bottom:15px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:12px 0;
}

.label{
  font-size:14px;
  opacity:0.7;
}

.value{
  font-size:28px;
  font-weight:600;
}

/* KEYPAD */
.keypad{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-top:20px;
}

.btn{
  height:60px;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:20px;
  cursor:pointer;
  transition:0.2s;
}

.btn:hover{
  background:rgba(255,255,255,0.2);
}

.ac{
  color:#ff7a9c;
}

.equal{
  color:#7fd4ff;
}

.zero{
  grid-column:span 2;
  border-radius:30px;
}

/* RESPONSIVE */
@media(max-width:400px){
  .phone{
    width:90%;
  }
}
</style>
</head>

<body>

<div class="phone">

  <div class="header">
    <span>←</span>
    <span>Temperature Converter</span>
  </div>

  <div class="display">
    <div class="row">
      <div class="label">°C</div>
      <div class="value" id="celsius">0</div>
    </div>

    <div class="row">
      <div class="label">°F</div>
      <div class="value" id="fahrenheit">32</div>
    </div>
  </div>

  <div class="keypad">

    <div class="btn">7</div>
    <div class="btn">8</div>
    <div class="btn">9</div>
    <div class="btn ac" id="clear">AC</div>

    <div class="btn">4</div>
    <div class="btn">5</div>
    <div class="btn">6</div>
    <div class="btn" id="delete">⌫</div>

    <div class="btn">1</div>
    <div class="btn">2</div>
    <div class="btn">3</div>
    <div class="btn" id="swap">⇄</div>

    <div class="btn zero">0</div>
    <div class="btn">.</div>

  </div>

</div>

<script>
let input = "";
let mode = "CtoF";

const celsius = document.getElementById("celsius");
const fahrenheit = document.getElementById("fahrenheit");

function updateDisplay(){
  let val = parseFloat(input) || 0;

  if(mode === "CtoF"){
    celsius.textContent = val;
    fahrenheit.textContent = ((val * 9/5)+32).toFixed(1);
  } else {
    fahrenheit.textContent = val;
    celsius.textContent = ((val-32)*5/9).toFixed(1);
  }
}

/* BUTTON CLICK */
document.querySelectorAll(".btn").forEach(btn=>{
  btn.addEventListener("click",()=>{

    let value = btn.textContent;

    if(value >= "0" && value <= "9" || value === "."){
      input += value;
    }

    if(btn.id === "clear"){
      input = "";
    }

    if(btn.id === "delete"){
      input = input.slice(0,-1);
    }

    if(btn.id === "swap"){
      mode = mode === "CtoF" ? "FtoC" : "CtoF";
    }

    updateDisplay();
  });
});

updateDisplay();
</script>

</body>
</html>
